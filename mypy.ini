; Type check without annotating the whole project: mypy checks the bodies of
; unannotated functions, but does not demand signatures. Run it via
; pre-commit, or: uvx mypy .
[mypy]
files = build.py, test_build.py, skill/scripts/mealie_ctx.py, standalone/optimize.py
check_untyped_defs = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
ignore_missing_imports = True
exclude = ^dist/
